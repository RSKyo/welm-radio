<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />

    <title>Audio Library</title>
    <link rel="icon" href="/assets/images/favicon1.ico" />

    <link rel="stylesheet" href="./css/theme-blue.css" />
    <link rel="stylesheet" href="./css/global.css" />

    <link rel="stylesheet" href="./css/audio.css" />

    <link rel="stylesheet" href="./component/toast.css" />
    <link rel="stylesheet" href="./component/chip-group.css" />
    <link rel="stylesheet" href="./component/item-list.css" />
    <link rel="stylesheet" href="./component/audio-player.css" />
    <link rel="stylesheet" href="./component/range.css" />
  </head>

  <body>
    <div class="vbox h-100 w-100">
      <!-- header -->
      <div class="hbox a-center page-header">
        <div class="grow px-12 py-4">
          <span class="page-title">Audio Library</span>
        </div>
      </div>

      <!-- main -->
      <div class="grow hbox">
        <!-- filter -->
        <div
          class="vbox gap-8"
          style="
            width: 240px;
            min-width: 120px;
            background: var(--color-surface);
          "
        >
          <div class="hbox j-end p-4 gap-4 bb">
            <button id="set-audio-root" class="icon-button" title="择音频目录">
              …
            </button>
          </div>
          <div class="grow vbox scroll px-4 gap-4">
            <div class="panel">
              <label>音频类型</label>
              <div id="audio-type-filter" data-name="audio-type-filter"></div>
            </div>

            <div class="panel">
              <label>音频位置</label>
              <div
                id="audio-position-filter"
                data-name="audio-position-filter"
              ></div>
            </div>

            <div class="panel">
              <label>音频日段</label>
              <div
                id="audio-day-part-filter"
                data-name="audio-day-part-filter"
              ></div>
            </div>

            <div class="panel">
              <label>音频语言</label>
              <div
                id="audio-language-filter"
                data-name="audio-language-filter"
              ></div>
            </div>

            <div class="panel">
              <label>音频分类</label>
              <div
                id="audio-category-filter"
                data-name="audio-category-filter"
              ></div>
            </div>

            <div class="panel">
              <label>音频备选组</label>
              <div
                id="audio-alternate-group-filter"
                data-name="audio-alternate-group-filter"
              ></div>
            </div>
          </div>
        </div>

        <!-- audio -->
        <div
          class="grow vbox gap-8"
          style="min-width: 360px; background: var(--color-surface)"
        >
          <div class="hbox j-begin p-4 gap-4 bb">
            <div class="grow hbox j-begin gap-4">
              <input id="select-all" type="checkbox" />
              <button id="import-audios" class="icon-button" title="导入音频">
                ＋
              </button>
              <button id="remove-audios" class="icon-button" title="删除音频">
                −
              </button>

              <button
                id="order-audios-desc"
                class="icon-button"
                data-order="updatedAt-desc"
                title="由新到旧"
              >
                ↓
              </button>
              <button
                id="order-audios-asc"
                class="icon-button"
                data-order="updatedAt-asc"
                title="由旧到新"
              >
                ↑
              </button>
            </div>

            <div class="audios-info">
              音频：
              <span id="audio-count">0</span>
            </div>
          </div>

          <div id="audios" class="grow scroll audio-list"></div>
          <div id="audio-player"></div>
        </div>

        <!-- meta -->
        <div
          class="vbox gap-8"
          style="
            width: 640px;
            min-width: 480px;
            background: var(--color-surface);
          "
        >
          <div class="hbox j-begin p-4 gap-4 bb">
            <button id="save-meta" class="icon-button" title="保存元数据">
              ✓
            </button>
          </div>

          <div class="grow vbox scroll px-4 gap-4">
            <form id="meta-form" class="form">
              <input name="audioPath" type="hidden" />
              <input name="metaPath" type="hidden" />
              <div class="form-field">
                <label>标题</label>
                <div class="joined-control">
                  <input
                    name="title"
                    type="text"
                    placeholder="音频标题"
                    class="grow join-left"
                  />
                  <input
                    name="extension"
                    type="text"
                    class="join-right input-raised"
                    value=".mp3"
                    readonly
                    style="width: 42px"
                  />
                </div>
              </div>
              <div class="form-field">
                <label>描述</label>
                <textarea
                  name="description"
                  rows="3"
                  placeholder="音频描述"
                ></textarea>
              </div>

              <div class="form-field">
                <label>语言</label>
                <div id="audio-language"></div>
              </div>

              <div class="form-field">
                <label>类型</label>
                <div id="audio-type"></div>
              </div>

              <div class="form-field">
                <label>位置</label>
                <div id="audio-position"></div>
              </div>

              <div class="form-field">
                <label>日段</label>
                <div id="audio-day-part"></div>
              </div>

              <div class="form-field">
                <label>分类</label>

                <textarea
                  name="category"
                  rows="3"
                  placeholder="天气, 新闻, 故事"
                ></textarea>
              </div>

              <div class="form-field">
                <label>剪切点</label>

                <textarea
                  name="cutPoints"
                  rows="5"
                  placeholder="每行填写一个时间 HH:MM:SS.mmm"
                ></textarea>
              </div>

              <div class="form-field">
                <label>内容</label>
                <textarea name="content" rows="8"></textarea>
                <div>
                  <button id="start-transcription" type="button">
                    识别音频内容
                  </button>
                  <button id="select-whisper-model" type="button">
                    选择 Whisper 模型
                  </button>
                  <button id="select-vad-model" type="button">
                    选择 VAD 模型
                  </button>
                </div>
                <div class="vbox">
                  <span id="whisper-model"></span>
                  <span id="vad-model"></span>
                </div>
              </div>

              <div class="form-field">
                <label>备选组</label>
                <input
                  name="alternateGroup"
                  type="text"
                  placeholder="同组音频唯一标识"
                />
              </div>

              <div class="form-field">
                <label>总时长</label>
                <input name="duration" type="text" />
              </div>

              <div class="form-field">
                <label>开始时间</label>
                <input name="start" type="text" />
              </div>

              <div class="form-field">
                <label>结束时间</label>
                <input name="end" type="text" />
              </div>

              <div class="form-field">
                <label>创建时间</label>
                <input name="createdAt" type="text" readonly />
              </div>

              <div class="form-field">
                <label>更新时间</label>
                <input name="updatedAt" type="text" readonly />
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="/assets/vendor/split/split.min.js"></script>
    <script type="module" src="./js/audio.js"></script>
  </body>
</html>
