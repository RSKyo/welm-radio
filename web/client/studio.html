<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />

    <title>Audio Studio</title>
    <link rel="icon" href="/assets/images/favicon2.ico" />

    <link rel="stylesheet" href="./css/theme-blue.css" />
    <link rel="stylesheet" href="./css/global.css" />

    <link rel="stylesheet" href="./css/studio.css" />
    <link rel="stylesheet" href="./component/toast.css" />

    <link rel="stylesheet" href="./component/combobox.css" />
    <link rel="stylesheet" href="./component/slider.css" />
    <link rel="stylesheet" href="./component/toggle-button.css" />
    <link rel="stylesheet" href="./component/timeline/ruler.css" />
    <link rel="stylesheet" href="./component/timeline/track-header-list.css" />
    <link rel="stylesheet" href="./component/timeline/track-list.css" />
    <link rel="stylesheet" href="./component/timeline/clip-group.css" />
    <link rel="stylesheet" href="./component/timeline/clip.css" />
    <link rel="stylesheet" href="./component/timeline/playhead.css" />
    <link rel="stylesheet" href="./component/timeline/cursor.css" />
  </head>

  <body>
    <div class="vbox h-100 w-100">
      <!-- header -->
      <div class="p-12-8 hbox a-center">
        <div class="grow">
          <h2 class="ib" style="color: var(--color-primary)">Audio Studio</h2>
        </div>
      </div>

      <!-- main -->
      <div class="grow hbox gap-4">
        <!-- left -->
        <div
          class="vbox"
          style="
            width: 240px;
            min-width: 120px;
            background-color: var(--color-surface);
          "
        >
          <div class="toolbar rt-4">
            <button id="add-track" type="button">添加音轨</button>
            <button id="add-clip" type="button">添加片段(测试)</button>
          </div>
          <div class="grow vbox p-0-8" style="position: relative">
            <div class="timeline-header">
              <div style="height: 32px"></div>
              <div id="track-header-list"></div>
            </div>
          </div>
        </div>
        <!-- right -->
        <div class="grow vbox" style="background-color: var(--color-surface)">
          <div class="toolbar rt-4">
            <div class="grow">
              <span id="timeline-cursor-info"></span>
              <span id="timeline-playhead-info"></span>
            </div>
            <div id="zoom" style="width: 208px"></div>
          </div>
          <div class="grow vbox p-0-8" style="position: relative">
            <div class="timeline">
              <div class="timeline-content vbox">
                <div id="ruler"></div>
                <div id="track-list" class="grow"></div>
                <div id="playhead"></div>
                <div id="timeline-cursor"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="/assets/vendor/split/split.min.js"></script>
    <script type="module" src="./js/studio.js"></script>
  </body>
</html>
