<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />

    <title>Audio Studio</title>
    <link rel="icon" href="/assets/images/favicon2.ico" />

    <link rel="stylesheet" href="./css/theme-blue.css" />
    <link rel="stylesheet" href="./css/global.css" />

    <link rel="stylesheet" href="./css/studio.css" />
    <link rel="stylesheet" href="./component/timeline-ruler.css" />
  </head>

  <body>
    <div class="vbox h-100 w-100">
      <!-- header -->
      <div class="p-12-8 hbox a-center">
        <div class="grow">
          <h2 class="ib" style="color: var(--color-primary)">Audio Studio</h2>
        </div>
      </div>

      <!-- main -->
      <div class="grow hbox">
        <!-- left -->
        <div
          class="p-12-8 m-0-8 scroll vbox gap-20"
          style="
            width: 240px;
            min-width: 120px;
            background-color: var(--color-surface);
          "
        >
          left
        </div>
        <!-- right -->
        <div class="grow vbox" style="background-color: var(--color-surface)">
          <div class="toolbar rt-4">
            <div class="volume-control">
              <input
                class="volume-slider"
                type="range"
                min="0"
                max="100"
                step="10"
                value="80"
                data-role="volume"
              />
            </div>
          </div>
          <div class="grow vbox p-0-8">
            <div style="height: 40px; overflow: hidden">
              <div id="timeline-ruler"></div>
            </div>
            <div class="grow" style="position: relative; overflow: auto">
              <div id="timeline-track-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="/assets/vendor/split/split.min.js"></script>
    <script type="module" src="./js/studio.js"></script>
  </body>
</html>
