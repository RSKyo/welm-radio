<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />

    <title>Audio Studio</title>
    <link rel="icon" href="/assets/images/favicon2.ico" />

    <link rel="stylesheet" href="./css/theme-blue.css" />
    <link rel="stylesheet" href="./css/global.css" />

    <link rel="stylesheet" href="./css/studio.css" />

    <link rel="stylesheet" href="./component/toast.css" />
    <link rel="stylesheet" href="./component/combobox.css" />
    <link rel="stylesheet" href="./component/slider.css" />
    <link rel="stylesheet" href="./component/toggle-button.css" />
    <link rel="stylesheet" href="./component/timeline/ruler.css" />
    <link rel="stylesheet" href="./component/timeline/track-header-list.css" />
    <link rel="stylesheet" href="./component/timeline/track-list.css" />
    <link rel="stylesheet" href="./component/timeline/clip-group.css" />
    <link rel="stylesheet" href="./component/timeline/clip.css" />
    <link rel="stylesheet" href="./component/timeline/playhead.css" />
    <link rel="stylesheet" href="./component/timeline/cursor.css" />
    <link rel="stylesheet" href="./component/timelet.css" />
    <link rel="stylesheet" href="./component/tumbler.css" />
  </head>

  <body>
    <div class="vbox h-100 w-100">
      <!-- header -->
      <div class="hbox a-center page-header">
        <div class="grow px-12 py-4">
          <span class="page-title">Audio Studio</span>
        </div>
      </div>

      <!-- audios -->
      <div class="hbox gap-4 p-4 bb audio-list"></div>

      <!-- main -->
      <div class="grow hbox">
        <!-- right -->
        <div class="grow vbox" style="background: var(--color-surface)">
          <div class="hbox p-4 bb">
            <div class="grow hbox gap-4">
              <button
                id="toggle-audios"
                class="icon-button"
                title="展开/折叠音频"
              >
                ≡
              </button>
              <button id="track-add" class="icon-button" title="添加音轨">
                ＋
              </button>
              <button id="track-remove" class="icon-button" title="删除音轨">
                −
              </button>
              <button id="clip-duplicate" class="icon-button" title="复制片段">
                ⧉
              </button>
              <button id="clip-split" class="icon-button" title="分割片段">
                ∕
              </button>
              <button id="clip-remove" class="icon-button" title="删除片段">
                −
              </button>
            </div>
            <div>
              <span id="cursor-timelet"></span>
              <span id="playhead-timelet"></span>
            </div>
            <div id="zoom" style="width: 60px" title="滚动缩放"></div>
          </div>
          <div class="grow vbox" style="position: relative">
            <div data-role="timeline-viewport" style="margin-left: 200px;">
              <div data-role="timeline-canvas" class="px-8">
                <div data-role="timeline-ruler"></div>
                <div class="line" style="margin: 0 -8px"></div>
                <div id="track-list"></div>
                <div data-role="timeline-playhead"></div>
                <div data-role="timeline-cursor"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="/assets/vendor/split/split.min.js"></script>
    <script type="module" src="./js/studio.js"></script>
  </body>
</html>
