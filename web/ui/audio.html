<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />

    <title>Audio Library</title>
    <link rel="icon" href="/assets/favicon.ico" />

    <link rel="stylesheet" href="/assets/blue.css" />
    <link rel="stylesheet" href="/assets/global.css" />
    <link rel="stylesheet" href="/components/chip-group.css" />
    <link rel="stylesheet" href="/components/list-group.css" />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <div id="app" class="vbox minh-0">
      <div
        class="hbox align-center b-line"
        style="padding: 12px 8px; gap: 8px; height: 40px"
      >
        <h1 class="grow page-title">Audio Library</h1>
        <button id="selectRootEl" title="选择音频库根目录">Audio Folder</button>
        <button id="saveMetaEl">Save</button>
      </div>

      <!-- Main Content Area -->
      <div class="grow hbox">
        <!-- Filter Area -->
        <div class="vbox r-line" style="width: 240px; min-width: 120px">
          <div class="panel">
            <div class="panel-body">
              <div id="typeChipsEl"></div>
            </div>
          </div>
        </div>

        <!-- Files Area -->
        <div class="grow vbox r-line" style="min-width: 360px">
          <!-- Audio Files -->
          <div class="panel grow">
            <div class="panel-header" style="padding: 2px 0; gap: 2px">
              <div class="list-item-checkbox">
                <input id="checkAllEl" type="checkbox" />
              </div>

              <button
                id="deleteButton"
                type="button"
                title="删除"
                aria-label="删除"
              >
                Delete
              </button>
            </div>
            <div class="panel-body">
              <div id="audioListEl"></div>
            </div>
          </div>
        </div>

        <!-- Meta Editor Area -->
        <div class="vbox" style="width: 640px; min-width: 480px">
          <textarea id="metaEditor" class="wrap"></textarea>
        </div>
      </div>
    </div>

    <!-- Templates -->
    <!-- Template for a file item -->
    <template id="audioItemTemplate">
      <div>
        <span></span>
      </div>
    </template>

    <!-- Template for a meta type -->
    <template id="typeItemTemplate">
      <div>
        <span></span>
      </div>
    </template>

    <!-- Scripts -->
    <script src="/assets/split.min.js"></script>
    <script type="module" src="index.js"></script>
  </body>
</html>
