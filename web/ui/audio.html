<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />

    <title>Audio Library</title>
    <link rel="icon" href="/assets/image/favicon.ico" />

    <link rel="stylesheet" href="/assets/css/theme-blue.css" />
    <link rel="stylesheet" href="/assets/css/global.css" />

    <link rel="stylesheet" href="/assets/component/toast.css" />
    <link rel="stylesheet" href="/assets/component/chip-group.css" />
    <link rel="stylesheet" href="/assets/component/item-list.css" />
  </head>

  <body>
    <div class="vbox h-100 w-100">
      <!-- header -->
      <div class="p-12-8 hbox a-center">
        <div class="grow">
          <h1 class="ib" style="color: var(--color-primary)">Audio Library</h1>
        </div>
      </div>

      <!-- main -->
      <div class="grow hbox">
        <!-- filter -->
        <div
          class="p-12-8 scroll vbox gap-20"
          style="
            width: 240px;
            min-width: 120px;
            background-color: var(--color-surface);
          "
        >
          <div class="shrink vbox gap-8">
            <label class="label">音频类型</label>
            <div id="audio-type-filter"></div>
          </div>

          <div class="shrink vbox gap-8">
            <label class="label">音频位置</label>
            <div id="audio-position-filter"></div>
          </div>

          <div class="shrink vbox gap-8">
            <label class="label">音频语言</label>
            <div id="audio-language-filter"></div>
          </div>

          <div class="shrink vbox gap-8">
            <label class="label">音频分类</label>
            <div id="audio-category-filter"></div>
          </div>
        </div>

        <!-- audio -->
        <div
          class="p-12-8 grow vbox"
          style="min-width: 360px; background-color: var(--color-surface)"
        >
          <div class="toolbar" style="padding-left: 0; gap: 0">
            <div class="hbox a-center j-center" style="width: 36px">
              <input id="select-all" type="checkbox" />
            </div>
            <div class="grow toolbar" style="padding-left: 0">
              <button id="remove-audio" type="button">删除</button>
              <button id="add-audio" type="button">添加</button>
              <button id="rename-audio" type="button">重命名</button>
              <button
                id="select-audio-dir"
                type="button"
                style="white-space: nowrap"
              >
                选择音频库根目录
              </button>
              <select id="select-order">
                <option value="default">默认</option>
                <option value="createdAt-desc">创建时间（新到旧）</option>
                <option value="createdAt-asc">创建时间（旧到新）</option>
                <option value="updatedAt-desc">更新时间（新到旧）</option>
                <option value="updatedAt-asc">更新时间（旧到新）</option>
              </select>
            </div>
            <div class="hbox a-center j-center p-0-8">
              共有音频：
              <span id="audio-count">0</span>
            </div>
          </div>
          <div id="audio-list" class="grow scroll"></div>
          <div class="hbox c-center j-center">
            <audio id="audio-player" controls></audio>
          </div>
        </div>

        <!-- meta -->
        <div
          class="p-12-8 vbox"
          style="
            width: 640px;
            min-width: 480px;
            background-color: var(--color-surface);
          "
        >
          <div class="toolbar">
            <button id="save-meta" type="button">保存</button>
          </div>
          <div class="p-12-8 grow scroll vbox gap-20">
            <form id="meta-form" class="form">
              <div class="form-field">
                <label>描述</label>
                <textarea
                  name="description"
                  rows="3"
                  placeholder="音频描述"
                ></textarea>
              </div>

              <div class="form-field">
                <label>同组音频</label>
                <input name="alternateGroup" type="text" placeholder="同组音频唯一标识" />
              </div>

              <div class="form-field">
                <label>类型</label>
                <div id="meta-type"></div>
              </div>

              <div class="form-field">
                <label>位置</label>
                <div id="meta-position"></div>
              </div>

              <div class="form-field">
                <label>语言</label>
                <div id="meta-language"></div>
              </div>

              <div class="form-field">
                <label>分类</label>

                <textarea
                  name="category"
                  rows="3"
                  placeholder="天气, 新闻, 故事"
                ></textarea>
              </div>

              <div class="form-field">
                <label>内容</label>
                <textarea name="content" rows="8"></textarea>
                <div>
                  <button id="transcribe-content" type="button">
                    自动识别内容
                  </button>
                </div>
              </div>

              <div class="form-field">
                <label>总时长</label>
                <div class="input-action">
                  <input
                    name="duration"
                    type="text"
                    placeholder="HH:MM:SS.mmm"
                  />
                  <button id="detect-duration" type="button">自动获取</button>
                </div>
              </div>

              <div class="form-field">
                <label>开始时间</label>
                <input name="start" type="text" placeholder="HH:MM:SS.mmm" />
              </div>

              <div class="form-field">
                <label>结束时间</label>
                <input name="end" type="text" placeholder="HH:MM:SS.mmm" />
              </div>

              <div class="form-field">
                <label>剪切点</label>

                <textarea
                  name="cutPoints"
                  rows="5"
                  placeholder="每行填写一个时间 HH:MM:SS.mmm"
                ></textarea>
              </div>

              <div class="form-field">
                <label>创建时间</label>
                <input name="createdAt" type="text" readonly />
              </div>

              <div class="form-field">
                <label>更新时间</label>
                <input name="updatedAt" type="text" readonly />
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="/assets/js/split.min.js"></script>
    <script type="module" src="audio.js"></script>
  </body>
</html>
