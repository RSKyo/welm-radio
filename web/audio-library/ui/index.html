<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Audio Library</title>
    <link rel="icon" href="/assets/favicon.ico" />

    <link rel="stylesheet" href="/assets/pico.cyan.min.css" />
    <link rel="stylesheet" href="/assets/global.css" />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body data-theme="light">
    <div id="app" class="vbox minh-0">
      <!-- Toolbar -->
      <div class="toolbar b-line">
        <h1 class="grow">Audio Library</h1>
        <button id="rootButton" title="选择音频库根目录">Audio Folder</button>
        <button id="saveButton">Save</button>
        <button id="refreshButton">Refresh</button>
      </div>

      <!-- Main Content Area -->
      <div class="grow hbox">
        <!-- Filter Area -->
        <div class="panel vbox r-line" style="width: 240px">
          <div class="panel">
            <div class="panel-body">
              <div id="metaTypeList" class="chip-list"></div>
            </div>
          </div>
        </div>

        <!-- Files Area -->
        <div class="grow vbox r-line" style="min-width: 360px">
          <!-- Audio Files -->
          <div class="panel grow">
            <div class="panel-header">
              <h4>Audio Files</h4>
            </div>
            <div id="fileList" class="panel-body"></div>
          </div>
        </div>

        <!-- Meta Editor Area -->
        <div class="vbox" style="width: 640px">
          <textarea id="metaEditor"></textarea>
        </div>
      </div>
    </div>

    <!-- Templates -->
    <!-- Template for a file item -->
    <template id="fileItemTemplate">
      <div class="file-item">
        <div class="file-name"></div>
      </div>
    </template>

    <!-- Template for a meta type -->
    <template id="metaTypeTemplate">
      <span class="chip"></span>
    </template>

    <!-- Scripts -->
    <script src="/assets/split.min.js"></script>
    <script src="/assets/global.js"></script>
    <script src="/assets/http.js"></script>
    <script src="index.js"></script>
  </body>
</html>
